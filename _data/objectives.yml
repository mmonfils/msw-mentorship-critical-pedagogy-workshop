- title: "Analyze Mentorship Impact"
  epas: "Competency 1, 9"
  description: "Analyze the impact of formal and informal mentorship on professional identity and academic persistence in emerging practitioners."
- title: "Develop Actionable Models"
  epas: "Competency 1, 2"
  description: "Create evidence-based recommendations for designing developmental, rather than administrative, mentorship models in academic and field settings."
- title: "Examine Reciprocal Growth"
  epas: "Competency 1, 8"
  description: "Discuss the reciprocal benefits of the mentoring relationship for both emerging practitioners (mentees) and experienced practitioners (mentors)."